if(root){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(walker.nextNode())translateText(walker.currentNode,current)}
document.querySelectorAll('input[placeholder]').forEach(el=>{if(!el.dataset.originalPlaceholder)el.dataset.originalPlaceholder=el.placeholder;el.placeholder=current==='it'?(esToIt[el.dataset.originalPlaceholder]||el.dataset.originalPlaceholder):el.dataset.originalPlaceholder});
document.querySelectorAll('select option').forEach(el=>{if(!el.dataset.originalLabel)el.dataset.originalLabel=el.textContent;el.textContent=current==='it'?(esToIt[el.dataset.originalLabel]||el.dataset.originalLabel):el.dataset.originalLabel;el.value=el.dataset.originalLabel});
}
const bar=document.createElement('div');bar.className='langbar';bar.innerHTML='<button type="button" data-lang="es">🇪🇸 Español</button><button type="button" data-lang="it">🇮🇹 Italiano</button>';document.querySelector('header').prepend(bar);
bar.addEventListener('click',e=>{const b=e.target.closest('button[data-lang]');if(!b)return;current=b.dataset.lang;localStorage.setItem('es-it-language',current);update()});
let busy=false;const obs=new MutationObserver(()=>{if(busy)return;busy=true;obs.disconnect();update();obs.observe(document.querySelector('main'),{subtree:true,childList:true});busy=false});
obs.observe(document.querySelector('main'),{subtree:true,childList:true});
if(isExercise){
const meter=document.createElement('div');meter.innerHTML='<div class="progress-info" id="progressText"></div><div class="quiz-meter"><div id="progressFill"></div></div>';
document.querySelector('#sheet').before(meter);
function refreshProgress(){const total=document.querySelectorAll('#sheet .q').length;const filled=[...document.querySelectorAll('#sheet .q')].filter(q=>{const input=q.querySelector('input[type=text]');return input?input.value.trim():!!q.querySelector('input[type=radio]:checked')}).length;document.getElementById('progressText').textContent=(current==='it'?'Completate: ':'Respondidas: ')+filled+' / '+total;document.getElementById('progressFill').style.width=(total?100*filled/total:0)+'%'}
document.querySelector('#sheet').addEventListener('input',refreshProgress);document.querySelector('#sheet').addEventListener('change',refreshProgress);
new MutationObserver(refreshProgress).observe(document.querySelector('#sheet'),{childList:true});refreshProgress();
}
update();
})();
</script></body></html>
